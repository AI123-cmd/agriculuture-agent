[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# NOTE: alembic.ini is read with the system locale encoding on Windows, so this
# file must stay ASCII-only. Chinese explanations live in alembic/env.py.

# migration filenames keep the revision prefix so directory order == apply order
file_template = %%(rev)s_%%(slug)s
# keep the version table in public regardless of search_path
version_table_schema = public

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S