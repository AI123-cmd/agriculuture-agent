[project]
name = "huanong-backend"
version = "1.1.0"
description = "话农点金 - AI 农事助手后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "pymysql>=1.1.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120