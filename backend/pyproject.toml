[project]
name = "huanong-backend"
version = "2.0.0"
description = "话农点金 - AI 农事助手后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "psycopg-pool>=3.2.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.10",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "PyYAML>=6.0",
    # 中文分词（T2-17 追问候选池的相关性粗排；同时也是知识库检索的关键词兜底分词器）
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ASYNC 规则集拦住"在 async 函数里用同步库"这类问题（误用 requests、同步 Session）
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 迁移脚本是同步的一次性工具，允许同步 IO 与子进程调用
"alembic/versions/*.py" = ["E", "F", "I", "UP", "B", "ASYNC"]
"scripts/*.py" = ["ASYNC", "B", "E", "F", "I", "UP"]
"tests/*.py" = ["B", "E", "F", "I", "UP", "ASYNC"]
# `tests/*.py` 的单星不覆盖子目录（T6-01 的 `tests/eval/`），评测集与其余测试同口径豁免。
"tests/**/*.py" = ["B", "E", "F", "I", "UP", "ASYNC"]
# 路由层的 Depends/File 写在默认值是 FastAPI 的官方写法（依赖注入靠默认值声明），
# 不构成 B008 想拦的"每次调用都重建可变默认值"问题，在此显式登记豁免。
"app/api/**/*.py" = ["B008"]
# app/agent/nodes/__init__.py 必须先定义 _db_from_config 再导入各节点子模块，
# 否则各节点 `from app.agent.nodes import _db_from_config` 会触发包初始化期循环导入。
"app/agent/nodes/__init__.py" = ["E402"]
# 枚举一律按技术方案 5.2 与各任务文件明文要求继承 `str, Enum`：该写法与 `StrEnum`
# 的差别在 `str()`/f-string 上（前者给 "ProcessId.RICE"，后者给 "rice"），而契约对象
# 里需要前者那种更显式的调试输出。这些文件登记豁免，新增枚举文件时一并加入。
"app/agent/state.py" = ["UP042"]
"app/agent/agents/handoff.py" = ["UP042"]
"app/process_config/rule_ids.py" = ["UP042"]
"app/gate/enums.py" = ["UP042"]
"app/knowledge/status.py" = ["UP042"]
# app/models/enums.py 的六个提示与触达枚举同样按技术方案明文继承 `str, Enum`。
"app/models/enums.py" = ["UP042"]
# app/domain/metrics.py 的 StandardMetric 与其余流程枚举同风格继承 `str, Enum`：
# 取值即落库字符串，`str` 混入让 `StandardMetric.AIR_TEMP == "air_temp"` 成立。
"app/domain/metrics.py" = ["UP042"]
# app/services/knowledge_review.py 的 KnowledgeAction 同样按技术方案明文继承 `str, Enum`。
"app/services/knowledge_review.py" = ["UP042"]
"app/agent/budget.py" = ["UP042"]
"app/agent/agents/base.py" = ["UP042"]
"app/llm/tiers.py" = ["UP042"]
"app/llm/circuit.py" = ["UP042"]
"app/llm/enums.py" = ["UP042"]
"app/llm/fallback.py" = ["UP042"]
# 适配器协议的 `timeout` 参数是技术方案 10.2 的接口原文，也是 httpx 施加超时的
# 正规做法（`AsyncClient(timeout=...)` 覆盖连接与读取全程）；ASYNC109 想拦的是
# "自己 sleep 却不设超时"那类漏设超时的写法，与这里的语义不符。三层保障的
# `chat_with_structured` 同样把 `timeout` 透传给适配器，不是自行 sleep。
"app/llm/providers/*.py" = ["ASYNC109"]
"app/llm/structured.py" = ["ASYNC109"]
# app/main.py 在 win32 上必须在导入 FastAPI 之前设置事件循环策略（psycopg 异步
# 连接池不支持 ProactorEventLoop），因此业务导入必须排在该语句之后。
"app/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^alembic/", "^scripts/", "^tests/"]

[tool.check-layers]
# L4 的合法入口：只有数据访问层与引擎封装可以直接构造查询语句。
db_query_allowed = ["app/repositories/", "app/db/"]
# 白名单条目上限：例外过多说明规则已被架空，该回头改代码而不是继续加条目。
max_allowlist_entries = 5

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 评测回归用例打 `@pytest.mark.eval`（T6-01）：默认全跑，需要时可用 `-m "not eval"` 跳过。
markers = ["eval: 离线评测集回归用例"]
