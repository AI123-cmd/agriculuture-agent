# 评测集分集权重与一致率口径（T6-02，技术方案 14.1）

# 一致率按分集加权汇总（见 runner 的 `weighted_consistency`）。
#
# `general = 1.5` 的加权理由：general 不是"另一条流程"，而是其余六条流程分流失败时的
# **接收方**（14.1 称之为"错误蓄水池"）。它的集内得分下降通常意味着上游分流出错，而
# 分流出错（2.2 缺口一）是产品说明书列为最不可妥协的一点。因此它的权重高于普通流程。
#
# `rapeseed = 0.5`：油菜调研排期未定（产品说明书附录 A 的 A7），本项按占位集交付，
# 题目少且保守，降权以避免少数占位题拉高或压弯总一致率。
[weights]
rice = 1.0
tea = 1.2
chili = 1.0
weed = 1.0
pig = 1.0
rapeseed = 0.5
general = 1.5

[thresholds]
# 绝对门禁由 Settings.HARNESS_PASS_RATE_THRESHOLD 提供（默认 0.90），此处不重复定义。
# 相对门禁：与上一次历史报告相比，任一流程一致率下降超过该百分点即阻断。
consistency_drop_pp = 1.0
