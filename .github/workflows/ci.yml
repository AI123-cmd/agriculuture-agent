name: ci

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 迁移依赖 pgvector 与 timescaledb 两个扩展，官方 postgres 镜像不带它们
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: huanong
          POSTGRES_USER: huanong
          POSTGRES_DB: huanong
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U huanong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 测试库与开发库分离（T1-08）：conftest 会据此建/清 huanong_test
      TEST_DATABASE_URL: postgresql+asyncpg://huanong:huanong@localhost:5432/huanong_test
      DATABASE_URL: postgresql+asyncpg://huanong:huanong@localhost:5432/huanong
      CHECKPOINT_DB_URL: postgresql://huanong:huanong@localhost:5432/huanong
      # 图测试与评测在 mock 模型下跑，CI 不依赖外部模型服务
      USE_MOCK_LLM: "true"
      REDIS_URL: ""
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 建测试库
        run: |
          PGPASSWORD=huanong psql -h localhost -U huanong -d huanong \
            -c 'CREATE DATABASE huanong_test OWNER huanong;'

      # 八项的顺序不是随意的：静态检查在前（失败最快、反馈最便宜），
      # 迁移与测试在后（需要数据库与更多耗时）。顺序与 scripts/ci.sh 第 1 至 7 项逐条一致。
      - name: 1 ruff check
        run: ruff check backend/app

      - name: 2 ruff format --check
        run: ruff format --check backend/app

      - name: 3 mypy
        run: cd backend && mypy app

      # 分层依赖的两条门禁：check_layers 判违规，check_no_noqa 判"有没有人试图绕过它"。
      - name: 4 分层依赖检查（不允许 noqa 跳过）
        run: |
          python backend/scripts/check_layers.py
          python backend/scripts/check_no_noqa.py

      - name: 5 迁移可升降
        run: cd backend && alembic upgrade head && alembic downgrade -1 && alembic upgrade head

      - name: 6 闸门规则单测
        run: cd backend && pytest -q tests/gate

      - name: 7 图路径测试
        run: cd backend && pytest -q tests/graph

      - name: 8 离线评测集回归
        run: cd backend && pytest -q -m eval tests/eval

      # 第 9 项：其余用例（含契约测试与集成测试）。评测已在前一项跑过，这里不重复标注
      # `-m eval`；`-p no:randomly` 保持执行顺序确定性，避免"本地过 CI 挂"。
      - name: 9 其余测试（契约与集成）
        run: cd backend && pytest -q -p no:randomly tests/contracts tests/

      # 前端适老化样式门禁（T4-01）：字号/行距/热区/间距字面量只允许在 tokens.wxss，
      # 例外集中登记在 scripts/wxss-token-whitelist.json。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: check-wxss-tokens
        run: node scripts/check_wxss_tokens.mjs
